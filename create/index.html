<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>写一封售后 · 剧本杀售后</title>
  <meta name="description" content="上传文字与图片，生成可分享的剧本杀售后网页，适用于微信、抖音、小红书。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #100e0c;
      --paper: #efe6d6;
      --paper-soft: #cfc3ae;
      --fade: rgba(239, 230, 214, 0.55);
      --seal: #9c2f2a;
      --line: rgba(239, 230, 214, 0.16);
      --panel: rgba(28, 24, 20, 0.72);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Serif SC", "Songti SC", serif;
      color: var(--paper);
      background: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 55% at 12% 8%, rgba(120, 48, 40, 0.2), transparent 55%),
        linear-gradient(180deg, #0c0a09 0%, #14110e 50%, #0f0d0b 100%);
    }
    .page { position: relative; z-index: 2; max-width: 1040px; margin: 0 auto; padding: 1.2rem 1rem 3rem; }
    .top { text-align: center; margin-bottom: 1.2rem; }
    .top-brand {
      font-family: "Ma Shan Zheng", cursive;
      font-size: clamp(2rem, 8vw, 2.8rem);
      letter-spacing: 0.18em; margin-left: 0.18em;
    }
    .top-line { width: 1.8rem; height: 1px; margin: 0.65rem auto 0.5rem; background: var(--seal); }
    .top-lead { color: var(--paper-soft); font-size: 0.86rem; letter-spacing: 0.14em; }
    .site-nav {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 0.45rem;
      margin-top: 0.9rem;
    }
    .site-nav__link {
      display: inline-block; padding: 0.45rem 0.95rem;
      border: 1px solid rgba(239, 230, 214, 0.22); color: var(--fade);
      text-decoration: none; font-size: 0.76rem; letter-spacing: 0.18em;
    }
    .site-nav__link:hover { color: var(--paper); border-color: rgba(239, 230, 214, 0.5); }
    .site-nav__link.is-active {
      color: var(--paper); border-color: rgba(156, 47, 42, 0.65);
      background: rgba(156, 47, 42, 0.22);
    }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: start; }
    .panel {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(8px);
      padding: 1rem;
    }
    .panel h2 {
      font-size: 0.82rem; letter-spacing: 0.24em; color: rgba(156, 47, 42, 0.9);
      margin-bottom: 0.9rem;
    }
    .field { margin-bottom: 0.85rem; }
    .field label {
      display: block; font-size: 0.75rem; letter-spacing: 0.14em;
      color: var(--fade); margin-bottom: 0.35rem;
    }
    .field input, .field textarea, .field select {
      width: 100%; background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--line); color: var(--paper);
      padding: 0.65rem 0.75rem; font-family: inherit; font-size: 0.92rem;
      border-radius: 2px;
    }
    .field textarea { min-height: 180px; resize: vertical; line-height: 1.75; }
    .field input:focus, .field textarea:focus, .field select:focus {
      outline: none; border-color: rgba(239, 230, 214, 0.45);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .upload {
      border: 1px dashed var(--line); padding: 1rem; text-align: center;
      cursor: pointer; transition: border-color 0.2s;
    }
    .upload:hover, .upload.drag { border-color: rgba(239, 230, 214, 0.5); }
    .upload p { font-size: 0.8rem; color: var(--fade); letter-spacing: 0.08em; }
    .img-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .img-item {
      position: relative;
      border: 1px solid var(--line);
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.25);
    }
    .img-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .img-item button {
      position: absolute; top: 4px; right: 4px;
      width: 22px; height: 22px; border: none; border-radius: 50%;
      background: rgba(0, 0, 0, 0.65); color: var(--paper);
      cursor: pointer; font-size: 14px; line-height: 1;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .btn {
      border: 1px solid rgba(239, 230, 214, 0.35);
      background: transparent; color: var(--paper);
      padding: 0.65rem 1rem; font-family: inherit; font-size: 0.82rem;
      letter-spacing: 0.16em; cursor: pointer;
    }
    .btn:hover { border-color: rgba(239, 230, 214, 0.75); }
    .btn.primary { background: rgba(156, 47, 42, 0.35); border-color: rgba(156, 47, 42, 0.65); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .hint { font-size: 0.72rem; color: var(--fade); margin-top: 0.5rem; line-height: 1.5; letter-spacing: 0.06em; }
    .hint.ok { color: #9fd4a8; }
    .hint.err { color: #e8a8a8; }
    .public-toggle {
      display: flex; align-items: flex-start; gap: 0.65rem;
      padding: 0.75rem; border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.2); cursor: pointer;
    }
    .public-toggle input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--seal); }
    .public-toggle strong {
      display: block; font-size: 0.84rem; letter-spacing: 0.1em; font-weight: 500;
      margin-bottom: 0.25rem;
    }
    .public-toggle small {
      display: block; font-size: 0.72rem; color: var(--fade); line-height: 1.5; letter-spacing: 0.04em;
    }
    .theme-presets {
      display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.65rem;
    }
    .theme-preset {
      border: 1px solid var(--line); background: transparent; color: var(--paper-soft);
      padding: 0.4rem 0.7rem; font-family: inherit; font-size: 0.76rem;
      letter-spacing: 0.12em; cursor: pointer;
    }
    .theme-preset.is-active {
      border-color: rgba(156, 47, 42, 0.65); color: var(--paper);
      background: rgba(156, 47, 42, 0.2);
    }
    .theme-colors label { font-size: 0.68rem; color: var(--fade); letter-spacing: 0.1em; margin-bottom: 0.25rem; display: block; }
    .theme-colors input[type="color"] {
      width: 100%; height: 34px; padding: 0; border: 1px solid var(--line);
      background: transparent; cursor: pointer;
    }
    .preview-stage {
      border: 1px solid var(--line);
      padding: 1rem 0.9rem;
      background: var(--pv-bg, var(--ink));
      color: var(--pv-text, var(--paper));
      transition: background 0.25s, color 0.25s;
    }
    .preview-stage .meta { color: var(--pv-accent, rgba(156, 47, 42, 0.85)); }
    .preview-stage .sub { color: var(--pv-text-soft, var(--paper-soft)); }
    .preview-stage .line { background: var(--pv-accent, var(--seal)); }
    .preview-stage h3 { font-family: "Ma Shan Zheng", cursive; color: var(--pv-text, var(--paper)); }
    .preview-stage .prose { font-family: var(--pv-font, "Noto Serif SC", serif); color: var(--pv-text, var(--paper)); }
    .preview .meta { font-size: 0.72rem; letter-spacing: 0.24em; color: rgba(156, 47, 42, 0.85); margin-bottom: 0.5rem; }
    .preview h3 {
      font-family: "Ma Shan Zheng", cursive;
      font-size: clamp(1.8rem, 6vw, 2.4rem); letter-spacing: 0.14em; margin-bottom: 0.25rem;
    }
    .preview .sub { color: var(--paper-soft); font-size: 0.85rem; letter-spacing: 0.1em; margin-bottom: 1rem; }
    .preview .line { width: 2rem; height: 1px; background: var(--seal); margin-bottom: 1rem; }
    .preview .prose { white-space: pre-wrap; letter-spacing: 0.04em; line-height: 1.9; font-size: 0.95rem; }
    .preview-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) min(140px, 38%);
      gap: 0.85rem;
      align-items: start;
    }
    .preview-side {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .preview-side img {
      width: 100%;
      border: 1px solid var(--line);
      object-fit: cover;
      aspect-ratio: 3 / 4;
      display: block;
    }
    .preview-side:empty { display: none; }
    .preview-layout.no-images { grid-template-columns: 1fr; }
    .modal {
      position: fixed; inset: 0; z-index: 50; display: none;
      align-items: center; justify-content: center; padding: 1rem;
      background: rgba(0, 0, 0, 0.72); backdrop-filter: blur(4px);
    }
    .modal.open { display: flex; }
    .modal-card {
      width: min(100%, 420px); border: 1px solid var(--line);
      background: #14110e; padding: 1.25rem;
    }
    .modal-card h3 { font-size: 1rem; letter-spacing: 0.2em; margin-bottom: 0.75rem; }
    .modal-card input {
      width: 100%; background: rgba(0,0,0,.35); border: 1px solid var(--line);
      color: var(--paper); padding: 0.6rem; font-size: 0.8rem; margin-bottom: 0.75rem;
    }
    .modal-card img { display: block; width: 160px; height: 160px; margin: 0 auto 0.75rem; background: #fff; padding: 6px; }
    .share-tips { font-size: 0.75rem; color: var(--fade); line-height: 1.6; margin-bottom: 0.75rem; }
    .share-tips strong { color: var(--paper-soft); font-weight: 500; }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
      .img-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .preview-layout { grid-template-columns: 1fr; }
      .preview-side { flex-direction: row; overflow-x: auto; }
      .preview-side img { width: 38vw; max-width: 140px; flex: 0 0 auto; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <h1 class="top-brand">创作售后</h1>
      <div class="top-line" aria-hidden="true"></div>
      <p class="top-lead">上传文字与配图，生成可分享链接</p>
      <nav class="site-nav" aria-label="站点导航">
        <a class="site-nav__link" href="../index.html">首页</a>
        <a class="site-nav__link" href="../browse/">公开售后</a>
        <a class="site-nav__link is-active" href="./">创作售后</a>
      </nav>
    </header>

    <div class="layout">
      <section class="panel editor">
        <h2>编辑</h2>
        <div class="row">
          <div class="field">
            <label for="script">剧本名</label>
            <input id="script" type="text" placeholder="如：青白" maxlength="60" />
          </div>
          <div class="field">
            <label for="me">我打的角色</label>
            <input id="me" type="text" placeholder="如：苏无恙" maxlength="40" />
          </div>
        </div>
        <div class="field">
          <label for="target">写给谁</label>
          <input id="target" type="text" placeholder="如：阿喜" maxlength="40" />
        </div>
        <div class="field">
          <label for="title">标题</label>
          <input id="title" type="text" placeholder="留空则自动生成「致某某」" maxlength="120" />
        </div>
        <div class="field">
          <label for="content">正文</label>
          <textarea id="content" placeholder="在这里写下你想对 TA 说的话……&#10;&#10;段落之间空一行即可分段。"></textarea>
        </div>
        <div class="field">
          <label>页面样式</label>
          <div class="theme-presets" id="themePresets"></div>
          <div class="row theme-colors">
            <div>
              <label for="bgColor">背景色</label>
              <input id="bgColor" type="color" value="#100e0c" />
            </div>
            <div>
              <label for="textColor">文字色</label>
              <input id="textColor" type="color" value="#efe6d6" />
            </div>
            <div>
              <label for="accentColor">点缀色</label>
              <input id="accentColor" type="color" value="#9c2f2a" />
            </div>
          </div>
          <div class="field" style="margin-top:0.65rem;margin-bottom:0">
            <label for="fontSelect">正文字体</label>
            <select id="fontSelect">
              <option value="serif">宋体</option>
              <option value="kai">楷体</option>
              <option value="song">明朝</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>配图（可选，最多 8 张）</label>
          <div class="upload" id="uploadZone">
            <p>点击或拖拽上传，可多选</p>
            <input id="fileInput" type="file" accept="image/*" multiple hidden />
          </div>
          <div class="img-grid" id="imgGrid"></div>
          <p class="hint" id="imgHint">图片会显示在正文右侧，多张可上下排列。</p>
        </div>
        <div class="field">
          <label class="public-toggle">
            <input id="isPublic" type="checkbox" />
            <span>
              <strong>公开到「公开售后」合集</strong>
              <small>勾选后所有人都能在合集页看到；不勾选则只有持链接的人能访问</small>
            </span>
          </label>
        </div>
        <div class="actions">
          <button class="btn" type="button" id="btnPreview">刷新预览</button>
          <button class="btn primary" type="button" id="btnShare">生成分享链接</button>
        </div>
        <p class="hint" id="statusHint"></p>
      </section>

      <section class="panel preview">
        <h2>预览</h2>
        <div class="preview-stage" id="previewStage">
        <p class="meta" id="pvMeta">剧本 · 角色</p>
        <h3 id="pvTitle">致……</h3>
        <p class="sub" id="pvSub">我 → TA</p>
        <div class="line" aria-hidden="true"></div>
        <div class="preview-layout" id="pvLayout">
          <div class="preview-main">
            <div class="prose" id="pvContent">在左侧输入正文后，这里会实时预览。</div>
          </div>
          <div class="preview-side" id="pvSide"></div>
        </div>
        </div>
      </section>
    </div>
  </div>

  <div class="modal" id="shareModal" aria-hidden="true">
    <div class="modal-card">
      <h3>分享链接已生成</h3>
      <input id="shareUrl" readonly />
      <img id="qrImg" alt="二维码" width="160" height="160" />
      <div class="share-tips">
        <strong>微信</strong>：复制链接发好友，或长按保存二维码扫码打开<br />
        <strong>抖音 / 小红书</strong>：复制链接粘贴到简介或评论区；配图会作为链接预览卡片
      </div>
      <div class="actions">
        <button class="btn primary" type="button" id="btnCopy">复制链接</button>
        <button class="btn" type="button" id="btnNativeShare">系统分享</button>
        <button class="btn" type="button" id="btnClose">关闭</button>
      </div>
      <p class="hint" id="modalHint"></p>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const els = {
      script: $("script"), me: $("me"), target: $("target"), title: $("title"), content: $("content"),
      uploadZone: $("uploadZone"), fileInput: $("fileInput"), imgGrid: $("imgGrid"),
      imgHint: $("imgHint"), statusHint: $("statusHint"),
      pvMeta: $("pvMeta"), pvTitle: $("pvTitle"), pvSub: $("pvSub"), pvContent: $("pvContent"),
      pvSide: $("pvSide"), pvLayout: $("pvLayout"), previewStage: $("previewStage"),
      isPublic: $("isPublic"),
      themePresets: $("themePresets"), bgColor: $("bgColor"), textColor: $("textColor"),
      accentColor: $("accentColor"), fontSelect: $("fontSelect"),
      shareModal: $("shareModal"), shareUrl: $("shareUrl"), qrImg: $("qrImg"), modalHint: $("modalHint"),
      btnPreview: $("btnPreview"), btnShare: $("btnShare"), btnCopy: $("btnCopy"), btnNativeShare: $("btnNativeShare"), btnClose: $("btnClose"),
    };

    const MAX_IMAGES = 8;
    let images = [];
    let lastShareUrl = "";
    let activePreset = "ink";

    const THEME_PRESETS = {
      ink: { label: "墨信", bg: "#100e0c", text: "#efe6d6", textSoft: "#cfc3ae", accent: "#9c2f2a" },
      paper: { label: "素笺", bg: "#f3ead8", text: "#2a221c", textSoft: "#5c5046", accent: "#8b3a34" },
      night: { label: "夜雨", bg: "#0b1220", text: "#d9e4f5", textSoft: "#9eb0c9", accent: "#5b8def" },
      rose: { label: "落樱", bg: "#1a1014", text: "#f5e3e8", textSoft: "#c9a3ad", accent: "#d45d79" },
      bamboo: { label: "青松", bg: "#0f1612", text: "#e2efe6", textSoft: "#a8bfb0", accent: "#4f8a6b" },
    };

    const FONT_STACKS = {
      serif: '"Noto Serif SC", "Songti SC", serif',
      kai: '"ZCOOL XiaoWei", "KaiTi", serif',
      song: '"Songti SC", "Noto Serif SC", serif',
    };

    function getThemePayload() {
      const p = THEME_PRESETS[activePreset];
      const usingPreset = p
        && els.bgColor.value === p.bg
        && els.textColor.value === p.text
        && els.accentColor.value === p.accent;
      return {
        preset: activePreset,
        bg: els.bgColor.value,
        text: els.textColor.value,
        textSoft: usingPreset ? p.textSoft : els.textColor.value,
        accent: els.accentColor.value,
        font: els.fontSelect.value,
      };
    }

    function applyPreset(key) {
      const p = THEME_PRESETS[key];
      if (!p) return;
      activePreset = key;
      els.bgColor.value = p.bg;
      els.textColor.value = p.text;
      els.accentColor.value = p.accent;
      renderPresetButtons();
      applyThemeStyles();
    }

    function renderPresetButtons() {
      els.themePresets.innerHTML = Object.entries(THEME_PRESETS).map(([key, p]) =>
        `<button type="button" class="theme-preset${key === activePreset ? " is-active" : ""}" data-preset="${key}">${p.label}</button>`
      ).join("");
      els.themePresets.querySelectorAll(".theme-preset").forEach((btn) => {
        btn.addEventListener("click", () => applyPreset(btn.dataset.preset));
      });
    }

    function applyThemeStyles() {
      const payload = getThemePayload();
      const stage = els.previewStage;
      stage.style.setProperty("--pv-bg", payload.bg);
      stage.style.setProperty("--pv-text", payload.text);
      stage.style.setProperty("--pv-text-soft", payload.textSoft);
      stage.style.setProperty("--pv-accent", payload.accent);
      stage.style.setProperty("--pv-font", FONT_STACKS[payload.font] || FONT_STACKS.serif);
    }

    function getTitle() {
      const t = els.title.value.trim();
      if (t) return t;
      const target = els.target.value.trim();
      return target ? `致${target}` : "剧本杀售后";
    }

    function updatePreview() {
      const script = els.script.value.trim();
      const me = els.me.value.trim();
      const target = els.target.value.trim();
      els.pvMeta.textContent = [script, me].filter(Boolean).join(" · ") || "剧本杀售后";
      els.pvTitle.textContent = getTitle();
      els.pvSub.textContent = me && target ? `${me} → ${target}` : (me || target || "");
      els.pvContent.textContent = els.content.value.trim() || "（暂无文字）";
      els.pvSide.innerHTML = images.map((src) => `<img src="${src}" alt="" />`).join("");
      els.pvLayout.classList.toggle("no-images", images.length === 0);
      renderImageGrid();
      applyThemeStyles();
    }

    function renderImageGrid() {
      els.imgGrid.innerHTML = images.map((src, i) => `
        <div class="img-item">
          <img src="${src}" alt="" />
          <button type="button" data-index="${i}" aria-label="删除图片">×</button>
        </div>`).join("");
      els.imgGrid.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          images.splice(Number(btn.dataset.index), 1);
          updatePreview();
        });
      });
    }

    function compressImage(dataUrl, maxW = 1000, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width;
          let h = img.height;
          if (w > maxW) {
            h = Math.round((h * maxW) / w);
            w = maxW;
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          let out = canvas.toDataURL("image/jpeg", quality);
          if (out.length > 320000 && quality > 0.42) {
            resolve(compressImage(dataUrl, maxW, quality - 0.1));
            return;
          }
          resolve(out);
        };
        img.onerror = () => reject(new Error("图片处理失败"));
        img.src = dataUrl;
      });
    }

    async function handleFiles(fileList) {
      const files = Array.from(fileList || []).filter((f) => f.type.startsWith("image/"));
      if (!files.length) return;
      if (images.length >= MAX_IMAGES) {
        els.imgHint.textContent = `最多上传 ${MAX_IMAGES} 张图片`;
        els.imgHint.className = "hint err";
        return;
      }

      els.imgHint.textContent = "正在压缩图片…";
      els.imgHint.className = "hint";

      try {
        for (const file of files) {
          if (images.length >= MAX_IMAGES) break;
          const reader = new FileReader();
          const dataUrl = await new Promise((res, rej) => {
            reader.onload = (e) => res(e.target.result);
            reader.onerror = () => rej(new Error("读取失败"));
            reader.readAsDataURL(file);
          });
          images.push(await compressImage(dataUrl));
        }
        els.imgHint.textContent = `✓ 已添加 ${images.length} 张图片`;
        els.imgHint.className = "hint ok";
        updatePreview();
      } catch (err) {
        els.imgHint.textContent = err.message || "图片处理失败";
        els.imgHint.className = "hint err";
      }
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        els.shareUrl.select();
        document.execCommand("copy");
      }
    }

    function openShareModal(url) {
      lastShareUrl = url;
      els.shareUrl.value = url;
      els.qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(url)}`;
      els.shareModal.classList.add("open");
      els.shareModal.setAttribute("aria-hidden", "false");
    }

    function closeShareModal() {
      els.shareModal.classList.remove("open");
      els.shareModal.setAttribute("aria-hidden", "true");
    }

    async function generateShareLink() {
      const title = getTitle();
      const content = els.content.value.trim();
      if (!title && !content) {
        els.statusHint.textContent = "请至少填写标题或正文";
        els.statusHint.className = "hint err";
        return;
      }

      els.btnShare.disabled = true;
      els.statusHint.textContent = "正在生成链接…";
      els.statusHint.className = "hint";

      try {
        const res = await fetch("/api/share", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title,
            content,
            script: els.script.value.trim(),
            me: els.me.value.trim(),
            target: els.target.value.trim(),
            images,
            public: els.isPublic.checked,
            theme: getThemePayload(),
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "生成失败");

        openShareModal(data.url);
        await copyText(data.url);
        const pubNote = data.public ? "，并已公开到合集" : "（仅链接可访问）";
        els.statusHint.textContent = `✓ 链接已复制${pubNote}`;
        els.statusHint.className = "hint ok";
        els.modalHint.textContent = data.public
          ? "链接已复制，该售后已出现在公开合集"
          : "链接已复制，未公开到合集";
      } catch (err) {
        els.statusHint.textContent = err.message || "生成失败，请稍后重试";
        els.statusHint.className = "hint err";
      } finally {
        els.btnShare.disabled = false;
      }
    }

    els.uploadZone.addEventListener("click", () => els.fileInput.click());
    els.fileInput.addEventListener("change", (e) => { handleFiles(e.target.files); e.target.value = ""; });
    els.uploadZone.addEventListener("dragover", (e) => { e.preventDefault(); els.uploadZone.classList.add("drag"); });
    els.uploadZone.addEventListener("dragleave", () => els.uploadZone.classList.remove("drag"));
    els.uploadZone.addEventListener("drop", (e) => {
      e.preventDefault();
      els.uploadZone.classList.remove("drag");
      handleFiles(e.dataTransfer.files);
    });

    ["input", "change"].forEach((evt) => {
      [els.script, els.me, els.target, els.title, els.content].forEach((el) => {
        el.addEventListener(evt, updatePreview);
      });
      [els.bgColor, els.textColor, els.accentColor, els.fontSelect].forEach((el) => {
        el.addEventListener(evt, () => { applyThemeStyles(); });
      });
    });

    renderPresetButtons();
    applyPreset("ink");
    updatePreview();

    els.btnPreview.addEventListener("click", updatePreview);
    els.btnShare.addEventListener("click", generateShareLink);
    els.btnCopy.addEventListener("click", async () => {
      const url = lastShareUrl || els.shareUrl.value;
      if (!url) return;
      await copyText(url);
      els.modalHint.textContent = "已复制";
    });
    els.btnNativeShare.addEventListener("click", async () => {
      const url = lastShareUrl || els.shareUrl.value;
      if (!url) return;
      if (navigator.share) {
        try {
          await navigator.share({ title: getTitle(), url });
          return;
        } catch { /* cancelled */ }
      }
      await copyText(url);
      els.modalHint.textContent = "已复制链接";
    });
    els.btnClose.addEventListener("click", closeShareModal);
    els.shareModal.addEventListener("click", (e) => {
      if (e.target === els.shareModal) closeShareModal();
    });
  </script>
</body>
</html>
